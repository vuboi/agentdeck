[workspace]
resolver = "2"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.49"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
specta-serde = "0.0.12"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
sha2 = "0.11.1"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tauri-plugin-single-instance = "2"
ag-protocol = { path = "crates/protocol" }
ag-store = { path = "crates/store" }
ag-core = { path = "crates/core" }
ag-adapters = { path = "crates/adapters" }
# No bundled CLI: the Copilot CLI is installed on demand (Settings > Connectors) and passed by path.
github-copilot-sdk = { version = "1.0.28", default-features = false, features = ["runtime"] }
indexmap = "2"
async-trait = "0.1"
ag-quota = { path = "crates/quota" }
ag-orchestrator = { path = "crates/orchestrator" }
ag-cdp = { path = "crates/cdp" }

# Reading hundreds of chat files in a debug build is slow; keep these two optimised.
[profile.dev.package.ag-adapters]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3
