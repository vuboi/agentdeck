# Build and publish AgentDeck for Windows, macOS (Apple silicon + Intel) and Linux.
# Run: push a tag like v0.1.0 (or start the workflow by hand). The tag's number becomes the app version, and the
# release carries latest.json, which installed apps read to offer the update.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-15-intel, args: '--target x86_64-apple-darwin' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from tag
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/set-version.mjs "$VERSION"

      # The notes come from docs/release-notes/v<version>.md; without it, from the commit titles since the last tag.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          FILE="docs/release-notes/v${VERSION}.md"
          if [ -f "$FILE" ]; then
            cp "$FILE" notes.md
          else
            PREV=$(git describe --tags --abbrev=0 --exclude "v${VERSION}" 2>/dev/null || true)
            RANGE="${PREV:+$PREV..}HEAD"
            { echo "### What's changed"; echo; git log "$RANGE" --no-merges --format='- %s' | cut -c1-200; } > notes.md
          fi
          { echo 'body<<NOTES_EOF'; cat notes.md; echo NOTES_EOF; } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'darwin') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v${{ env.VERSION }}
          releaseName: AgentDeck v${{ env.VERSION }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
