[package]
name = "agentdeck-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agentdeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance.workspace = true
ag-adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
base64 = "0.22"
portable-pty = "0.9"
png = "0.17"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
walkdir = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
ignore = "0.4.33"
tree-sitter = "0.27.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
getrandom = "0.3"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Already in the tree through the notification plugin; used directly for the toast's AgentDeck logo (notify.rs).
tauri-winrt-notification = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
enigo = { version = "0.5", default-features = false, features = ["x11rb"] }
