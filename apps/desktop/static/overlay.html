<!doctype html>
<!-- The menu overlay of the AgentDeck browser: see src-tauri/src/overlay.rs. --><html><head><meta charset="utf-8"><style id="app"></style><style>
html,body{margin:0;padding:0;background:transparent!important;overflow:hidden}
#root{position:absolute}
#root [data-z-hover-glide-highlight]{position:absolute;top:0;left:0;margin:0;z-index:-1;pointer-events:none;opacity:0}
#root>*{position:static!important;inset:auto!important;transform:none!important;margin:0!important;opacity:1!important;visibility:visible!important;max-width:none!important;max-height:none!important}
#root *{animation:none!important}
#root *:not([data-z-hover-glide-highlight]):not([style*="transition"]){transition-property:background-color,color,border-color,opacity!important}
</style></head><body><div id="root"></div><script>
const BASE = navigator.userAgent.includes('Windows') ? 'http://agentdeck.localhost/' : 'agentdeck://localhost/';
const post = (message) => fetch(BASE + 'r', { method: 'POST', body: JSON.stringify(message), mode: 'no-cors' }).catch(() => {});
const root = document.getElementById('root');
const PICK = 'button,a,[role=menuitem],[role=menuitemradio],[role=menuitemcheckbox],[role=option],[role=radio],[role=checkbox]';
/** Makes `from` like `to`, keeping the elements that are still there. The glide highlight's place is the mirror's own. */
function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) {
    from.replaceWith(to.cloneNode(true));
    return;
  }
  if (from.nodeType !== 1) {
    if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue;
    return;
  }
  const own = from.hasAttribute('data-z-hover-glide-highlight');
  for (const name of [...from.getAttributeNames()]) if (!to.hasAttribute(name) && !(own && name === 'style')) from.removeAttribute(name);
  for (const name of to.getAttributeNames()) {
    if (own && name === 'style') continue;
    const value = to.getAttribute(name);
    if (from.getAttribute(name) !== value) from.setAttribute(name, value);
  }
  if ((from.tagName === 'INPUT' || from.tagName === 'TEXTAREA') && from.value !== (to.getAttribute('value') ?? to.textContent)) from.value = to.getAttribute('value') ?? to.textContent;
  const a = [...from.childNodes];
  const b = [...to.childNodes];
  b.forEach((node, index) => (a[index] ? morph(a[index], node) : from.appendChild(node.cloneNode(true))));
  for (const node of a.slice(b.length)) node.remove();
}
window.__overlay = {
  css(text) { document.getElementById('app').textContent = text; },
  clear() {
    root.getAnimations().forEach((animation) => animation.cancel());
    root.innerHTML = '';
  },
  /** Closes like a z-ui popover: a quick fade and shrink. */
  close() {
    root.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.96)' }], { duration: 110, easing: 'ease-in', fill: 'forwards' });
  },
  render(html, attrs, x, y, w, origin) {
    const doc = document.documentElement;
    for (const name of [...doc.getAttributeNames()]) doc.removeAttribute(name);
    for (const [name, value] of Object.entries(attrs.html)) doc.setAttribute(name, value);
    document.body.className = attrs.body;
    root.style.left = x + 'px';
    root.style.top = y + 'px';
    root.style.width = w + 'px';
    // The same menu again (a hover, a typed letter): patched in place, so its transitions play (the command
    // palette's highlight glides to the hovered row). Another menu: drawn anew.
    const template = document.createElement('template');
    template.innerHTML = html;
    const next = template.content.firstElementChild;
    const now = root.firstElementChild;
    if (now && next && now.tagName === next.tagName && root.childElementCount === 1) morph(now, next);
    else root.innerHTML = html;
    // A popover-API element is hidden unless opened in the top layer; the mirror is plain markup.
    for (const node of root.querySelectorAll('[popover]')) node.removeAttribute('popover');
    // A scrolled list is shown where it is scrolled to (markup carries no scroll position).
    for (const node of root.querySelectorAll('[data-mirror-scroll]')) node.scrollTop = Number(node.dataset.mirrorScroll);
    if (origin) {
      // A new menu opens like a z-ui popover. The overlay is hidden until shown, and frames only run once it is
      // on screen, so the animation starts exactly when it can be seen.
      root.getAnimations().forEach((animation) => animation.cancel());
      root.style.transformOrigin = origin;
      root.animate([{ opacity: 0, transform: 'scale(0.96)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 150, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'backwards' });
    }
  },
  pointer(x, y, kind) {
    let cursor = document.getElementById('__agentdeck_overlay_cursor');
    if (!cursor) {
      cursor = document.createElement('div');
      cursor.id = '__agentdeck_overlay_cursor';
      cursor.style.cssText = 'position:fixed;left:0;top:0;z-index:2147483647;pointer-events:none;opacity:0;will-change:transform;transition:transform 520ms cubic-bezier(.2,.9,.25,1),opacity 220ms ease';
      cursor.innerHTML = `<div style="position:absolute;left:-14px;top:-14px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.35),rgba(124,92,255,0) 70%);filter:blur(2px)"></div><svg width="20" height="20" viewBox="0 0 20 20" style="position:relative;display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35)) drop-shadow(0 4px 10px rgba(0,0,0,.18))"><path d="M2.2 1.6c-.3-.2-.7.1-.6.5l3.9 15.1c.1.4.7.5.9.1l2.5-4.9c.1-.2.3-.3.5-.3l5.4-.4c.4 0 .6-.5.3-.8L2.2 1.6z" fill="#111827" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
      document.body.appendChild(cursor);
    }
    cursor.style.opacity = '1';
    cursor.style.transform = `translate(${x - 2}px, ${y - 2}px)`;
    clearTimeout(window.__agentdeckOverlayCursorTimer);
    window.__agentdeckOverlayCursorTimer = setTimeout(() => (cursor.style.opacity = '0'), 3000);
  },
};
root.addEventListener('click', (event) => {
  const target = event.target.closest(PICK);
  if (!target) return;
  event.preventDefault();
  post({ kind: 'overlay-click', index: [...root.querySelectorAll(PICK)].indexOf(target) });
});
// z-hover-glide: the highlight box glides to the hovered item, as in the app.
let lastItem = null;
root.addEventListener('pointerover', (event) => {
  const item = event.target.closest('[data-glide-item]');
  const host = item && item.closest('[data-z-hover-glide]');
  if (!item || item === lastItem || !host) return;
  const box = host.querySelector(':scope > [data-z-hover-glide-highlight]');
  if (!box || item.matches('[aria-checked="true"],[aria-disabled="true"],:disabled')) return;
  const from = lastItem && lastItem.closest('[data-z-hover-glide]') === host;
  lastItem = item;
  const a = host.getBoundingClientRect();
  const b = item.getBoundingClientRect();
  box.style.cssText = `position:absolute;top:0;left:0;margin:0;z-index:-1;pointer-events:none;width:${b.width}px;height:${b.height}px;transform:translate(${b.left - a.left + host.scrollLeft}px, ${b.top - a.top + host.scrollTop}px);opacity:1;transition:${from ? 'transform 150ms cubic-bezier(0.16,1,0.3,1), width 150ms, height 150ms, opacity 120ms' : 'opacity 120ms ease-out'}`;
});
root.addEventListener('pointerleave', () => {
  lastItem = null;
  for (const box of root.querySelectorAll('[data-z-hover-glide-highlight]')) box.style.opacity = '0';
});
addEventListener('keydown', (event) => post({ kind: 'overlay-key', key: event.key }));
// The pointer over a row is the pointer over the real row: the real menu moves its highlight, the mirror follows.
let hovered = null;
root.addEventListener('pointermove', (event) => {
  const item = event.target.closest(PICK);
  if (!item || item === hovered) return;
  hovered = item;
  post({ kind: 'overlay-hover', index: [...root.querySelectorAll(PICK)].indexOf(item) });
});
root.addEventListener('pointerleave', () => (hovered = null));
// Loaded (again): the app sends its styles now, not when the first menu opens.
post({ kind: 'overlay-ready' });
// The clear margin around the menu is not the menu: a press there goes to the app below.
addEventListener('pointerdown', (event) => {
  if (!root.contains(event.target)) post({ kind: 'overlay-pass', x: event.clientX, y: event.clientY });
  // The keyboard goes back to the app, where the real menu or dialog is.
  else post({ kind: 'overlay-press' });
});
// A wheel over the mirror scrolls the real list, and the mirror follows.
addEventListener('wheel', (event) => post({ kind: 'overlay-wheel', x: event.clientX, y: event.clientY, dx: event.deltaX, dy: event.deltaY }), { passive: true });
</script></body></html>
